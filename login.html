<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8f2">
  <title>로그인 — 틈</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages/auth.css">
</head>
<body class="page auth-page" data-auth-page="login">
<header class="site-header"><div class="container header-inner"><a class="logo" href="index.html" aria-label="틈 홈">틈</a><div class="header-spacer"></div><a class="header-link" href="explore.html">여행지 둘러보기</a><a class="header-link" href="signup.html">회원가입</a></div></header>
<main class="auth-main"><div class="container auth-layout">
  <section class="auth-copy"><p class="kicker">Welcome back</p><h1>다시, 작은 여행을<br>이어가볼까요?</h1><p>이 로그인은 서버 인증이 아닌 LocalStorage 기반 Front-end Demo입니다.</p><div class="auth-postcard-note">LOCAL<br>DEMO</div></section>
  <section class="auth-card"><p class="auth-card-label">LOG IN</p><h2>로그인</h2>
    <form id="login-form" novalidate>
      <label class="auth-field">이메일<input id="login-email" type="email" autocomplete="email" required><span class="field-error" data-error-for="loginEmail"></span></label>
      <label class="auth-field">비밀번호<input id="login-password" type="password" autocomplete="current-password" required><span class="field-error" data-error-for="loginPassword"></span></label>
      <p class="form-message" id="login-message" role="alert"></p>
      <button class="auth-primary" type="submit">로그인 →</button>
    </form>
    <div class="auth-secondary-actions"><a href="signup.html">회원가입</a><button type="button" data-bs-toggle="modal" data-bs-target="#resetModal">비밀번호 재설정 Demo</button></div>
  </section>
</div></main>
<div class="modal fade" id="resetModal" tabindex="-1" aria-labelledby="resetTitle" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content teum-modal"><div class="modal-header"><div><p class="auth-card-label">FRONT-END DEMO</p><h2 class="modal-title fs-5" id="resetTitle">비밀번호 재설정</h2></div><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button></div><div class="modal-body"><p class="modal-note">실제 이메일 인증 없이, 가입된 이메일이 있으면 브라우저의 LocalStorage 비밀번호 해시를 변경합니다.</p><form id="reset-form"><label class="auth-field">가입 이메일<input id="reset-email" type="email" required></label><label class="auth-field">새 비밀번호<input id="reset-password" type="password" minlength="8" required></label><label class="auth-field">새 비밀번호 확인<input id="reset-confirm" type="password" minlength="8" required></label><p class="form-message" id="reset-message" role="alert"></p><button class="auth-primary" type="submit">재설정하기</button></form></div></div></div></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="auth-toast" class="toast" role="status"><div class="toast-body"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="js/pages/authPage.js"></script>
</body></html>
