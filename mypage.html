<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8f2">
  <title>마이페이지 — 틈</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/pages/auth.css">
</head>
<body class="page auth-page" data-auth-page="mypage">
<header class="site-header"><div class="container header-inner"><a class="logo" href="index.html" aria-label="틈 홈">틈</a><div class="header-spacer"></div><a class="header-link" href="explore.html">여행지 둘러보기</a><button class="header-logout" id="header-logout" type="button">로그아웃</button><span class="my-pill">MY</span></div></header>
<main class="auth-main mypage-main"><div class="container">
  <section class="auth-required" id="auth-required" hidden><p class="kicker">My teum</p><h1>로그인이 필요해요.</h1><p>회원 정보를 확인하려면 먼저 로그인해주세요.</p><a class="auth-primary inline" href="login.html?next=mypage">로그인하기 →</a></section>
  <div class="mypage-grid" id="mypage-content" hidden>
    <section class="profile-postcard"><p class="auth-card-label">MY POSTCARD</p><div class="profile-avatar" id="profile-avatar">T</div><h1 id="profile-name"></h1><p id="profile-email"></p><div class="profile-stamp">TEUM<br>MEMBER</div></section>
    <section class="auth-card profile-editor"><p class="auth-card-label">PROFILE</p><h2>회원정보</h2><form id="profile-form"><label class="auth-field">닉네임<input id="profile-nickname" type="text" required></label><label class="auth-field">이메일<input id="profile-email-input" type="email" required></label><p class="form-message" id="profile-message"></p><button class="auth-primary" type="submit">수정 저장</button></form><div class="account-actions"><button type="button" data-bs-toggle="modal" data-bs-target="#passwordModal">비밀번호 변경 Demo</button><button class="danger-link" type="button" data-bs-toggle="modal" data-bs-target="#deleteModal">회원 탈퇴</button></div></section>
    <section class="auth-card preference-editor"><p class="auth-card-label">TRAVEL TASTE</p><h2>여행 취향</h2><div id="preference-summary" class="preference-summary"><p>여행 취향을 불러오는 중입니다.</p></div></section>
  </div>
</div></main>
<div class="modal fade" id="passwordModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content teum-modal"><div class="modal-header"><h2 class="modal-title fs-5">비밀번호 변경 Demo</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="mypage-password-form"><label class="auth-field">새 비밀번호<input id="mypage-password" type="password" minlength="8" required></label><label class="auth-field">새 비밀번호 확인<input id="mypage-password-confirm" type="password" minlength="8" required></label><p class="form-message" id="mypage-password-message"></p><button class="auth-primary" type="submit">변경하기</button></form></div></div></div></div>
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content teum-modal"><div class="modal-header"><h2 class="modal-title fs-5">정말 탈퇴할까요?</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><p class="modal-note">이 브라우저의 회원 Demo 데이터와 현재 로그인 세션이 삭제됩니다.</p><button class="auth-danger" type="button" id="confirm-delete">회원 탈퇴하기</button></div></div></div></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="auth-toast" class="toast" role="status"><div class="toast-body"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="js/pages/authPage.js"></script>
</body></html>
