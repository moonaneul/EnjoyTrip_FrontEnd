<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8f2">
  <title>회원가입 — 틈</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages/auth.css">
</head>
<body class="page auth-page" data-auth-page="signup">
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html" aria-label="틈 홈">틈</a>
    <div class="header-spacer"></div>
    <a class="header-link" href="explore.html">여행지 둘러보기</a>
    <a class="header-link" href="login.html">로그인</a>
  </div>
</header>
<main class="auth-main">
  <div class="container auth-layout">
    <section class="auth-copy">
      <p class="kicker">Your own little teum</p>
      <h1>나만의 틈을<br>기록해볼까요?</h1>
      <p>회원 기능은 이번 Front-end 프로젝트에서 LocalStorage로 구현한 학습용 Demo입니다.</p>
      <div class="auth-postcard-note">SERVER AUTH<br>NOT INCLUDED</div>
    </section>
    <section class="auth-card">
      <p class="auth-card-label">SIGN UP</p>
      <h2>회원가입</h2>
      <form id="signup-form" novalidate>
        <label class="auth-field">닉네임<input id="signup-nickname" name="nickname" type="text" autocomplete="nickname" required><span class="field-error" data-error-for="nickname"></span></label>
        <label class="auth-field">이메일<input id="signup-email" name="email" type="email" autocomplete="email" required><span class="field-error" data-error-for="email"></span></label>
        <label class="auth-field">비밀번호<input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required><span class="field-error" data-error-for="password"></span></label>
        <label class="auth-field">비밀번호 확인<input id="signup-confirm" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required><span class="field-error" data-error-for="confirmPassword"></span></label>
        <button class="auth-primary" type="submit">가입하기 →</button>
      </form>
      <p class="auth-switch">이미 계정이 있나요? <a href="login.html">로그인</a></p>
    </section>
  </div>
</main>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="auth-toast" class="toast" role="status"><div class="toast-body"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/pages/authPage.js"></script>
</body>
</html>
