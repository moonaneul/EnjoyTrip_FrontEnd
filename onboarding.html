<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8f2">
  <title>여행 취향 설정 — 틈</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages/onboarding.css">
</head>
<body class="page onboarding-page">
<header class="site-header"><div class="container header-inner"><a class="logo" href="index.html" aria-label="틈 홈">틈</a><div class="header-spacer"></div><button class="survey-skip" id="skipSurvey" type="button">기본 취향으로 건너뛰기</button></div></header>
<main class="onboarding-main"><div class="container onboarding-shell">
  <section class="onboarding-copy"><p class="kicker">Your travel taste</p><h1>당신의 여행 취향을<br>조금만 알려주세요.</h1><p>한 번만 설정하면 다음부터는 출발지와 시간 같은 이번 여행 조건만 입력하면 돼요.</p><div class="survey-progress-track"><span id="surveyProgress"></span></div></section>
  <section class="survey-card">
    <form id="preferenceForm">
      <div class="survey-step" data-survey-step><p class="survey-step-label">01 / 06</p><h2>여행에서 어떤 순간이 좋아요?</h2><p>여러 개 골라도 좋아요.</p><div class="survey-choice-grid" id="categoryChoices"></div></div>
      <div class="survey-step" data-survey-step hidden><p class="survey-step-label">02 / 06</p><h2>하루 일정은 어느 정도가 좋아요?</h2><div class="range-block"><div><span>느긋하게</span><span>꽉 채우기</span></div><input name="pace" type="range" min="0" max="100" value="50"></div></div>
      <div class="survey-step" data-survey-step hidden><p class="survey-step-label">03 / 06</p><h2>이동은 어느 정도까지 괜찮아요?</h2><div class="survey-radio-grid"><label><input type="radio" name="travelTolerance" value="low">가까운 곳 위주</label><label><input type="radio" name="travelTolerance" value="medium" checked>적당한 이동</label><label><input type="radio" name="travelTolerance" value="high">좋은 곳이라면 멀어도 OK</label></div><h3>걷는 여행은요?</h3><div class="survey-radio-grid"><label><input type="radio" name="walkingTolerance" value="low">적게 걷기</label><label><input type="radio" name="walkingTolerance" value="medium" checked>적당히</label><label><input type="radio" name="walkingTolerance" value="high">많이 걸어도 좋아요</label></div></div>
      <div class="survey-step" data-survey-step hidden><p class="survey-step-label">04 / 06</p><h2>어떤 장소가 더 끌려요?</h2><label class="range-block"><div><span>유명 명소</span><span>숨은 장소</span></div><input name="discoveryStyle" type="range" min="0" max="100" value="50"></label><div class="survey-radio-grid compact"><label><input type="radio" name="environmentPreference" value="indoor">실내</label><label><input type="radio" name="environmentPreference" value="balanced" checked>둘 다</label><label><input type="radio" name="environmentPreference" value="outdoor">야외</label></div><div class="survey-radio-grid compact"><label><input type="radio" name="atmospherePreference" value="quiet">조용함</label><label><input type="radio" name="atmospherePreference" value="balanced" checked>균형</label><label><input type="radio" name="atmospherePreference" value="lively">활기참</label></div></div>
      <div class="survey-step" data-survey-step hidden><p class="survey-step-label">05 / 06</p><h2>먹고 쉬는 건 얼마나 중요해요?</h2><label class="importance-row"><span>맛집</span><input name="foodImportance" type="range" min="0" max="100" value="50"></label><label class="importance-row"><span>카페</span><input name="cafeImportance" type="range" min="0" max="100" value="50"></label><label class="importance-row"><span>휴식</span><input name="restImportance" type="range" min="0" max="100" value="50"></label></div>
      <div class="survey-step" data-survey-step hidden><p class="survey-step-label">06 / 06</p><div class="survey-summary" id="surveySummary"></div></div>
    </form>
    <div class="survey-actions"><button type="button" class="survey-secondary" id="surveyPrev">← 이전</button><button type="button" class="survey-primary" id="surveyNext">다음 →</button><button type="button" class="survey-primary" id="surveyComplete" hidden>이 취향으로 시작하기 →</button></div>
  </section>
</div></main>
<script type="module" src="js/pages/onboardingPage.js"></script>
</body></html>
